name: Release

# A v* tag on main publishes a release. Every pull request runs the same build, checks and
# notes as a dry run, without publishing anything. See CONTRIBUTING.md for the release flow.
on:
  push:
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Release dry run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # tags and main, for the checks and the changelog link

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check the version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            node scripts/release.js check "$GITHUB_REF_NAME"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "❌ $GITHUB_REF_NAME is not on main"; exit 1; }
          else
            node scripts/release.js check
          fi

      - name: Unit tests
        run: npm run test:unit

      - name: Build extension
        run: npm run build

      - name: Check every file reference in dist/ resolves
        run: npm run verify:dist

      - name: Create zip package
        run: npm run zip

      - name: Write the checksum
        run: |
          sha256sum sidecove-extension.zip > sidecove-extension.zip.sha256
          sha256sum -c sidecove-extension.zip.sha256

      - name: Write the release notes from CHANGELOG.md
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          node scripts/release.js notes "$VERSION" > release-notes.md
          cat release-notes.md

      - name: Keep the release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            sidecove-extension.zip
            sidecove-extension.zip.sha256
            release-notes.md
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write

    steps:
      - name: Get the release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sidecove-extension.zip

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" sidecove-extension.zip sidecove-extension.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sidecove ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag
